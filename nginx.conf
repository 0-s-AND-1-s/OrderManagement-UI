server {
    listen 80;
    server_name 0sand1s.com;

    return 301 https://0sand1s.com$request_uri;
}

server {
    listen 443 ssl;
    server_name 0sand1s.com;

    ssl_certificate     /etc/letsencrypt/live/0sand1s.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/0sand1s.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:9090;
    }
}